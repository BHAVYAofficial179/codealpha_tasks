<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #e5e5e5;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .calculator {
            width: 330px;

            background: #222;

            padding: 20px;

            border-radius: 15px;

            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Display */
        #display {
            width: 100%;
            height: 70px;

            margin-bottom: 15px;

            padding: 10px;

            font-size: 30px;

            text-align: right;

            border: none;
            border-radius: 8px;

            background: white;
        }

        /* Buttons */
        .buttons {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 10px;
        }

        button {
            height: 60px;

            border: none;

            border-radius: 8px;

            font-size: 22px;

            cursor: pointer;

            background: #ddd;

            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            background: white;
        }

        .operator {
            background: orange;
            color: white;
        }

        .clear {
            background: red;
            color: white;
        }

        .equal {
            background: green;
            color: white;
        }

        .zero {
            grid-column: span 2;
        }

        /* Mobile */
        @media (max-width: 400px) {

            .calculator {
                width: 95%;
            }

            button {
                height: 55px;
            }
        }

    </style>
</head>

<body>

    <div class="calculator">

        <h1>Calculator</h1>

        <!-- Display -->
        <input type="text" id="display" value="0" readonly>

        <!-- Buttons -->
        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">
                C
            </button>

            <button onclick="deleteNumber()">
                ⌫
            </button>

            <button onclick="appendOperator('%')">
                %
            </button>

            <button class="operator" onclick="appendOperator('/')">
                ÷
            </button>


            <button onclick="appendNumber('7')">
                7
            </button>

            <button onclick="appendNumber('8')">
                8
            </button>

            <button onclick="appendNumber('9')">
                9
            </button>

            <button class="operator" onclick="appendOperator('*')">
                ×
            </button>


            <button onclick="appendNumber('4')">
                4
            </button>

            <button onclick="appendNumber('5')">
                5
            </button>

            <button onclick="appendNumber('6')">
                6
            </button>

            <button class="operator" onclick="appendOperator('-')">
                −
            </button>


            <button onclick="appendNumber('1')">
                1
            </button>

            <button onclick="appendNumber('2')">
                2
            </button>

            <button onclick="appendNumber('3')">
                3
            </button>

            <button class="operator" onclick="appendOperator('+')">
                +
            </button>


            <button class="zero" onclick="appendNumber('0')">
                0
            </button>

            <button onclick="appendNumber('.')">
                .
            </button>

            <button class="equal" onclick="calculate()">
                =
            </button>

        </div>

    </div>


    <script>

        let display = document.getElementById("display");


        // Add number
        function appendNumber(number) {

            if (display.value === "0") {
                display.value = number;
            }
            else {
                display.value += number;
            }

        }


        // Add operator
        function appendOperator(operator) {

            let lastCharacter =
                display.value.charAt(
                    display.value.length - 1
                );

            // Prevent two operators together
            if ("+-*/%".includes(lastCharacter)) {
                return;
            }

            display.value += operator;

        }


        // Clear display
        function clearDisplay() {

            display.value = "0";

        }


        // Delete last number
        function deleteNumber() {

            if (display.value.length === 1) {
                display.value = "0";
            }
            else {
                display.value =
                    display.value.slice(0, -1);
            }

        }


        // Calculate
        function calculate() {

            try {

                let result = eval(display.value);

                display.value = result;

            }
            catch (error) {

                display.value = "Error";

            }

        }


        // Keyboard support
        document.addEventListener("keydown", function(event) {

            let key = event.key;

            // Numbers
            if (!isNaN(key)) {
                appendNumber(key);
            }

            // Decimal
            else if (key === ".") {
                appendNumber(".");
            }

            // Operators
            else if ("+-*/%".includes(key)) {
                appendOperator(key);
            }

            // Enter
            else if (key === "Enter") {
                calculate();
            }

            // Backspace
            else if (key === "Backspace") {
                deleteNumber();
            }

            // Escape
            else if (key === "Escape") {
                clearDisplay();
            }

        });

    </script>

</body>
</html>
