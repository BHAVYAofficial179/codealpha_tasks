<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        /* Filter Buttons */
        .filters {
            text-align: center;
            margin-bottom: 25px;
        }

        .filters button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background: #333;
            color: white;
            cursor: pointer;
        }

        .filters button:hover {
            background: #555;
        }

        /* Gallery */
        .gallery {
            max-width: 1000px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .gallery-item {
            overflow: hidden;
            border-radius: 10px;
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .gallery-item img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
            cursor: pointer;
            transition: 0.4s;
        }

        .gallery-item img:hover {
            transform: scale(1.08);
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .lightbox img {
            max-width: 80%;
            max-height: 80%;
            border-radius: 10px;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 35px;
            color: white;
            font-size: 45px;
            cursor: pointer;
        }

        .prev,
        .next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.3);
            color: white;
            border: none;
            font-size: 30px;
            padding: 15px 20px;
            cursor: pointer;
            border-radius: 5px;
        }

        .prev {
            left: 30px;
        }

        .next {
            right: 30px;
        }

        .prev:hover,
        .next:hover {
            background: rgba(255,255,255,0.6);
        }

        /* Responsive */
        @media (max-width: 700px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 450px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>📸 Image Gallery</h1>

    <!-- Filter Buttons -->
    <div class="filters">
        <button onclick="filterImages('all')">All</button>
        <button onclick="filterImages('nature')">Nature</button>
        <button onclick="filterImages('city')">City</button>
        <button onclick="filterImages('animal')">Animals</button>
    </div>

    <!-- Gallery -->
    <div class="gallery">

        <div class="gallery-item nature">
            <img src="https://picsum.photos/id/10/600/400"
                 onclick="openLightbox(0)"
                 alt="Nature">
        </div>

        <div class="gallery-item nature">
            <img src="https://picsum.photos/id/11/600/400"
                 onclick="openLightbox(1)"
                 alt="Nature">
        </div>

        <div class="gallery-item city">
            <img src="https://picsum.photos/id/1011/600/400"
                 onclick="openLightbox(2)"
                 alt="City">
        </div>

        <div class="gallery-item city">
            <img src="https://picsum.photos/id/1031/600/400"
                 onclick="openLightbox(3)"
                 alt="City">
        </div>

        <div class="gallery-item animal">
            <img src="https://picsum.photos/id/237/600/400"
                 onclick="openLightbox(4)"
                 alt="Animal">
        </div>

        <div class="gallery-item animal">
            <img src="https://picsum.photos/id/582/600/400"
                 onclick="openLightbox(5)"
                 alt="Animal">
        </div>

    </div>


    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">

        <span class="close" onclick="closeLightbox()">×</span>

        <button class="prev" onclick="previousImage()">❮</button>

        <img id="lightbox-img" src="" alt="Preview">

        <button class="next" onclick="nextImage()">❯</button>

    </div>


    <script>

        // Image URLs
        const images = [
            "https://picsum.photos/id/10/1000/700",
            "https://picsum.photos/id/11/1000/700",
            "https://picsum.photos/id/1011/1000/700",
            "https://picsum.photos/id/1031/1000/700",
            "https://picsum.photos/id/237/1000/700",
            "https://picsum.photos/id/582/1000/700"
        ];

        let currentIndex = 0;


        // Open Lightbox
        function openLightbox(index) {

            currentIndex = index;

            document.getElementById("lightbox").style.display = "flex";

            document.getElementById("lightbox-img").src =
                images[currentIndex];
        }


        // Close Lightbox
        function closeLightbox() {

            document.getElementById("lightbox").style.display = "none";

        }


        // Next Image
        function nextImage() {

            currentIndex++;

            if (currentIndex >= images.length) {
                currentIndex = 0;
            }

            document.getElementById("lightbox-img").src =
                images[currentIndex];

        }


        // Previous Image
        function previousImage() {

            currentIndex--;

            if (currentIndex < 0) {
                currentIndex = images.length - 1;
            }

            document.getElementById("lightbox-img").src =
                images[currentIndex];

        }


        // Filter Images
        function filterImages(category) {

            const items =
                document.querySelectorAll(".gallery-item");

            items.forEach(function(item) {

                if (category === "all") {

                    item.style.display = "block";

                }
                else if (item.classList.contains(category)) {

                    item.style.display = "block";

                }
                else {

                    item.style.display = "none";

                }

            });

        }


        // Keyboard Support
        document.addEventListener("keydown", function(event) {

            if (event.key === "ArrowRight") {
                nextImage();
            }

            if (event.key === "ArrowLeft") {
                previousImage();
            }

            if (event.key === "Escape") {
                closeLightbox();
            }

        });

    </script>

</body>
</html>
